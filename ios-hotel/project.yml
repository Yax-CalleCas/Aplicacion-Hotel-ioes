name: HotelApp
options:
  bundleIdPrefix: pe.agrocorp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "17.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G48CMF53GY
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HotelApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HotelApp
        excludes:
          - "Info.plist"
          # Basura que deja el share de VMware/HFS+: si entra al proyecto,
          # Xcode intenta compilarla y falla con errores incomprensibles.
          - "**/._*"
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.agrocorp.hotel
        PRODUCT_NAME: Hotel
        INFOPLIST_FILE: HotelApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Facebook SDK se configura con el App ID de Info.plist.
        OTHER_LDFLAGS:
          - "-ObjC"
    dependencies:
      - sdk: CoreData.framework
      - sdk: Security.framework
      - sdk: AVFoundation.framework
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Facebook
        product: FacebookLogin
